version: "3.9"

services:
  blacksentinel-strike:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/blacksentinel-cibersecurity/blacksentinel-strike-free:latest
    container_name: blacksentinel-strike-prod
    hostname: blacksentinel-strike
    restart: unless-stopped
    ports:
      - "127.0.0.1:5900:5900"   # VNC
      - "127.0.0.1:6080:6080"   # noVNC
    volumes:
      - blacksentinel-vault:/root/.blacksentinel-strike/vault
      - blacksentinel-logs:/root/.blacksentinel-strike/logs
      - blacksentinel-data:/root/.blacksentinel-strike/data
      - ${HOST_VAULT_DIR:-~/.blacksentinel-strike/vault/scans}:/root/.blacksentinel-strike/vault/scans
    environment:
      - PYTHONUNBUFFERED=1
      - DISPLAY=:0
      - VAULT_DIR=/root/.blacksentinel-strike/vault
      - LOG_DIR=/root/.blacksentinel-strike/logs
      - BLACKSENTINEL_MODE=production
      - VAULT_PASSWORD=${VAULT_PASSWORD:-}
      - VNC_PASSWORD=${VNC_PASSWORD:-}
      - SHODAN_API_KEY=${SHODAN_API_KEY:-}
      - CENSYS_API_KEY=${CENSYS_API_KEY:-}
      - WEBHOOK_URL=${WEBHOOK_URL:-}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - STEALTH_MODE=${STEALTH_MODE:-false}
      - RATE_LIMIT_ENABLED=${RATE_LIMIT_ENABLED:-true}
    cap_drop:
      - ALL
    cap_add:
      - NET_RAW
      - NET_ADMIN
    security_opt:
      - no-new-privileges:true
    mem_limit: 4g
    cpus: 2
    healthcheck:
      test: ["CMD", "python3", "-c", "import socket; s=socket.socket(); s.connect(('127.0.0.1',5900)); s.close()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

volumes:
  blacksentinel-vault:
    driver: local
    driver_opts:
      type: none
      device: ${HOME}/.blacksentinel-strike/vault
      o: bind
  blacksentinel-logs:
    driver: local
  blacksentinel-data:
    driver: local
