name: Scheduled Security Scan

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  security:
    name: Weekly Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install bandit safety pip-audit
      - name: Run Bandit
        run: bandit -r . -c .bandit -f json -o bandit-report.json || true
      - name: Run Safety Check
        run: safety check -r requirements.txt --output json > safety-report.json || true
      - name: Run pip-audit
        run: pip-audit -r requirements.txt --format json --output pip-audit-report.json || true
      - name: Upload Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-reports
          path: |
            bandit-report.json
            safety-report.json
            pip-audit-report.json
          retention-days: 30
