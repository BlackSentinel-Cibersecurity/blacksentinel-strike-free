[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "blacksentinel-strike"
version = "4.1.0"
description = "Advanced Penetration Testing GUI Framework - BlackSentinel Strike"
readme = "README.md"
license = {text = "All Rights Reserved"}
requires-python = ">=3.10"
authors = [
    {name = "BlackSentinel Strike"},
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Information Technology",
    "Topic :: Security",
    "License :: Proprietary :: All Rights Reserved",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "customtkinter>=5.2.0",
    "psutil>=5.9.0",
    "requests>=2.28.0",
    "python-nmap>=0.7.1",
    "cryptography>=41.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "flake8>=6.0",
    "bandit>=1.7",
    "safety>=2.3",
    "pip-audit>=2.6",
]

[project.scripts]
blacksentinel-strike = "app:main"

[project.urls]
Homepage = "https://github.com/blacksentinel-strike/blacksentinel-strike"
Repository = "https://github.com/blacksentinel-strike/blacksentinel-strike"

[tool.setuptools.packages.find]
exclude = ["tests*", "venv*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.bandit]
exclude_dirs = ["tests", "venv"]

[tool.flake8]
max-line-length = 120
exclude = [".git", "__pycache__", "tests", "venv"]
